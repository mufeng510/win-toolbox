[workspace]
resolver = "2"
members = [
    "crates/toolbox-core",
    "crates/tool-hashrename",
    "crates/tool-heic2jpg",
    "crates/tool-classic-menu",
    "crates/tool-flatten",
    "crates/tool-image-merge",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
toolbox-core = { path = "crates/toolbox-core" }
tool-hashrename = { path = "crates/tool-hashrename" }
tool-heic2jpg = { path = "crates/tool-heic2jpg" }
tool-classic-menu = { path = "crates/tool-classic-menu" }
tool-flatten = { path = "crates/tool-flatten" }
tool-image-merge = { path = "crates/tool-image-merge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
