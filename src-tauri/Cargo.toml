[package]
name = "win-toolbox-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "win_toolbox_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "win-toolbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toolbox-core = { workspace = true }
tool-hashrename = { workspace = true }
tool-heic2jpg = { workspace = true }
tool-classic-menu = { workspace = true }
tool-flatten = { workspace = true }
tool-image-merge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
