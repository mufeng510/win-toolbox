name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0). Leave empty to keep the current version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Determine version and release tag
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $v = $env:INPUT_VERSION
            if ($v) { $tag = "v$v" } else { $tag = "manual-$($env:RUN_NUMBER)" }
          } else {
            $tag = $env:REF_NAME
            $v = $tag.TrimStart('v')
          }
          if ($v) {
            ./scripts/set-version.ps1 -Version $v
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Tauri app
        run: npm run tauri build

      - name: Show artifacts
        shell: pwsh
        run: |
          $bundle = 'target/release/bundle'
          if (-not (Test-Path $bundle)) {
            Write-Host "Bundle directory not found: $bundle"
            exit 1
          }
          Get-ChildItem -Path $bundle -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: win-toolbox ${{ steps.meta.outputs.tag }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
